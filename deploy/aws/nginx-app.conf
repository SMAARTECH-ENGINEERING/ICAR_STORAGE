# Reverse proxy: public 80/443 -> the backend container, bound to
# 127.0.0.1:5000 only (never exposed directly to the internet).
#
# Install: sudo cp nginx-app.conf /etc/nginx/conf.d/icar-storage.conf
#          sudo nginx -t && sudo systemctl reload nginx
#
# Then run `sudo certbot --nginx -d <DOMAIN_NAME>` — it edits this file in
# place to add the HTTPS server block and cert paths, and sets up renewal.

# Only send "Connection: upgrade" on actual WebSocket requests (Socket.IO);
# plain REST calls get "Connection: close" so HTTP keep-alive isn't broken.
# This is nginx's own documented pattern for proxying WebSockets.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name <DOMAIN_NAME>;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
